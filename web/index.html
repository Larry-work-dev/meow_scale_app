<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>Coffee Scale</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-content">
        <span class="status-indicator disconnected" id="status-indicator"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>
      <button id="simulator-btn" class="btn-connect" title="Test without hardware">Simulator</button>
      <button id="connect-btn" class="btn-connect">Connect</button>
    </div>

    <!-- Weight Display -->
    <div class="weight-display">
      <div class="weight-value-container">
        <span class="weight-value" id="weight-value">0.0</span>
      </div>
      <div class="weight-unit-toggle">
        <button class="unit-btn active" data-unit="g">g</button>
        <button class="unit-btn" data-unit="kg">kg</button>
      </div>
    </div>

    <!-- Timer Display -->
    <div class="timer-section">
      <div class="timer-display" id="timer-display">00:00</div>
      <div class="timer-controls">
        <button id="timer-toggle-btn" class="btn-control">▶ Start</button>
        <button id="timer-reset-btn" class="btn-control">↻ Reset</button>
      </div>
    </div>

    <!-- Flow Rate Display -->
    <div class="flow-rate-section">
      <div class="flow-rate-label">Flow Rate</div>
      <div class="flow-rate-value" id="flow-rate-value">0.00</div>
      <div class="flow-rate-unit">g/s</div>
    </div>

    <!-- Flow Rate Chart -->
    <div class="chart-container">
      <canvas id="flow-chart"></canvas>
    </div>

    <!-- Main Controls -->
    <div class="controls-section">
      <button id="tare-btn" class="btn-primary">Tare</button>
    </div>

    <!-- Notifications -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Bluetooth Modal -->
    <div id="bluetooth-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Select Device</h2>
          <button class="modal-close" onclick="this.closest('.modal').style.display='none'">✕</button>
        </div>
        <div id="device-list" class="device-list"></div>
        <button id="scan-again-btn" class="btn-modal">Scan Again</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
